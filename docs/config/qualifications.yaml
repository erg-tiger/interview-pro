# version: 0.2.0
# tags: [config, qualifications, technicians, urgency, yaml]

# Which skills each job type requires and its default urgency tier (see urgency.yaml).
# Technician skills live in data/technicians.json.
# Overrides let a dispatcher force-allow or block a specific technician for a job type.
# Example values only.

job_types:
  drain_cleaning:
    required_skills: [plumbing]
    urgency: standard
  burst_pipe_repair:
    required_skills: [plumbing]
    urgency: emergency
  water_heater_install:
    required_skills: [plumbing, gas_certified]
    urgency: standard
  ac_repair:
    required_skills: [hvac]
    urgency: standard

# technician_overrides:
#   tech-003:
#     allow: [water_heater_install]
#     block: []
technician_overrides: {}
