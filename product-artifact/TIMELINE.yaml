      - "Checked in the browser: replayed proposals return instantly, the safety checks run again on the live schedule, the S5 retry history is preserved, custom reports and bad scenario ids are refused, and the card is labeled as a recording."
      - "Unit tests grew to 19 passing, including a check that recording ids cannot escape the recordings folder."
    why_it_matters: It mitigates the biggest practical demo risk and lets a reviewer try the prototype without the author's login, while staying honest that it is a recording and not a second provider.
    decisions:
