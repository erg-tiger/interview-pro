      - "Plan impact (revenue covered, revenue handed back, drive minutes to reach moved jobs) is computed in code and shown on the proposal card."
      - "Scenarios load from config/scenarios.yaml; S9 (HVAC specialist out) and S10 (easy day) added. S10 was run live: one automatic reassignment, $230 covered, 27 drive minutes, about 6K tokens."
      - "Unit tests grew to 17 passing, including a check that scenarios name real technicians."
    why_it_matters: It turns the industry-priority claim into something that can be compared by number, at a small token cost, and makes the demo less repetitive.
    decisions:
      - "0017: plan impact in code, scenarios in YAML, sharper goal guidance; richer personas, a recurring-service dataset and repeated runs deliberately not done."
    ai_usage:
      tools: [GitHub Copilot, Pi]
      purpose: Costed the options, implemented the changes, and ran one live scenario to check them.
      ai_was_wrong: null
      done_without_ai: "The author set the token constraint and chose to proceed with the cheap options after seeing the costs."
    artifact_sections: [solution-design, measurement, scenarios]
    links: [prototype/lib/impact.mjs, prototype/config/scenarios.yaml, prototype/config/goals.yaml, product-artifact/decisions/0017-plan-impact-and-scenarios-in-yaml.md]

  - id: beat-015
    date: 2026-10-27
    title: Replay mode as a demo safety net
    summary: The prototype depends on one model through one login with no fallback, so a failed model call would stop the live demo. A replay mode now plays back recorded real proposals while the safety checks, approval and undo still run live.
    outcomes:
