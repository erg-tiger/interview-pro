# version: 0.1.0
# tags: [config, scenarios, demo, yaml]

# Demo scenarios for the call-out form. Each one fills in a report and may override a setting for that run only.
# Fields: id, label, description, technician_id, until (HH:MM, empty = rest of the day), note,
#         overrides: profile | permissions | jobUrgency | inject
# The expected results for S1 to S8 are in PLAN.md; S9 and S10 have not been run live.

scenarios:
  - id: S1
    label: S1 Base call-out
    description: Dana calls in sick for the rest of the day. The agent uses the scheduling priority set in Settings (start on Job revenue).
    technician_id: T3
    note: Dana called in sick this morning and will not work today.

  - id: S2
    label: S2 Same report, business optimizes drive distance
    description: The same report, but this run forces the Drive time priority, whatever Settings says.
    technician_id: T3
    note: Dana called in sick this morning and will not work today.
    overrides: { profile: drive_distance }

  - id: S3
    label: S3 Same report, business approves every change
    description: The same report, but this business wants to approve every change, even simple reassignments.
    technician_id: T3
    note: Dana called in sick this morning and will not work today.
    overrides: { permissions: { reassign_job: approval } }

  - id: S4
    label: "S4 Failure: no qualified technician free in time"
    description: The same report, but the water heater install (J5) is an emergency, so a late start is not acceptable.
    technician_id: T3
    note: Dana called in sick this morning and will not work today.
    overrides: { jobUrgency: { J5: emergency } }

  - id: S5
    label: "S5 Failure: the first proposal is unsafe (injected test)"
    description: The same report, but the first proposal is deliberately unsafe, to show the safety checks catching it.
    technician_id: T3
    note: Dana called in sick this morning and will not work today.
    overrides: { inject: true }

  - id: S6
    label: S6 Ambiguous note
    description: Dana is unsure whether she will be back. The agent has to say what it assumes.
    technician_id: T3
    note: Not sure if I will be back this afternoon, maybe by 2pm.

  - id: S9
    label: S9 HVAC specialist out
    description: Tom, an HVAC technician, has a truck breakdown. Only two other HVAC technicians exist and both have jobs nearby in time.
    technician_id: T5
    note: Tom's truck broke down on the way in; he cannot do any jobs today.

  - id: S10
    label: S10 Easy day, one drain job
    description: Marcus is out for the day with one simple drain job. A low-risk plan that can run without approval.
    technician_id: T1
    note: Marcus has a dentist appointment and is out for the day.
